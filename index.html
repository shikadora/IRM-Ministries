tbody tr:hover{background:var(--tint)}
td.r,th.r{text-align:right;white-space:nowrap}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}

.task{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}

.svc li{align-items:flex-start}

function toRow(col,id,d){
  var m=FM[col],o={id:id};
  Object.keys(m).forEach(function(k){
    if(!(k in d)||k==='at')return;var c=m[k],v=d[k];
    if(c==='ministry')v=Array.isArray(v)?v:String(v||'').split(/[,;]/).map(function(s){return s.trim()}).filter(Boolean);
    else if(c==='bpm'||c==='size_bytes')v=(v===''||v==null)?null:Number(v);
    else if(v===''&&NUL[c])v=null;
    o[c]=v;
  });
  return o;
}
function fromRow(col,r){
  var m=FM[col],o={id:r.id};
  Object.keys(m).forEach(function(k){
    var c=m[k],v=r[c];
    if(c==='is_sample'){if(v)o.sample=true;return}
    if(c==='ministry')v=(v||[]).join(', ');

}

  var keep={};items.forEach(function(it){keep[it.id]=1});
  var gone=prev.filter(function(p){return p.id&&!keep[p.id]}).map(function(p){return p.id});

}

function openForm(col,id){
  var S=SCHEMA[col],rec=id?state[col].find(function(x){return x.id===id}):null;
  openModal((rec?'Edit ':'Add ')+S.one,S.fields,rec||S.def||{},'data-kind="rec" data-col="'+col+'" data-id="'+(id||'')+'"',!!rec);
}
function svcFields(){
  return [
   {k:'type',l:'Part of the service',t:'select',o:SVC_TYPES},
   {k:'song',l:'Song (when the part is a song)',t:'select',o:[{v:'',l:'None'}].concat(state.songs.slice().sort(function(a,b){return (a.title||'').localeCompare(b.title||'')}).map(function(s){return {v:s.id,l:s.title+(s.key?' ('+s.key+')':'')}}))},
   {k:'label',l:'Title',full:1},
   {k:'min',l:'Minutes',t:'number'},
   {k:'notes',l:'Notes',full:1}];
}
function openSvc(i){
  var rec=state.services.find(function(s){return s.id===ui.svc}),items=rec&&rec.items?rec.items:[];
  var it=i!=null?items[i]:{type:'Song',min:5};
  openModal(i!=null?'Edit service item':'Add service item',svcFields(),it,'data-kind="svc" data-i="'+(i!=null?i:'')+'"',i!=null);
}
function deptOpts(){return state.departments.slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'')}).map(function(d){return {v:d.id,l:d.name}})}
function repFields(withFile){
  var f=[{k:'dept',l:'Department folder',t:'select',o:deptOpts()},{k:'meeting',l:'LCC meeting date',t:'date',req:1},{k:'title',l:'Report title',req:1,full:1},{k:'by',l:'Submitted by'}];
  if(withFile)f.push({k:'file',l:'File',t:'file',full:1});
  f.push({k:'note',l:'Note',t:'textarea',full:1});
  return f;
}
function openUpload(){
  if(!ASSETS){toast('Uploading is not available right now. Please sign in again.');return}
  openModal('Upload report',repFields(true),{dept:ui.dept!=='all'?ui.dept:(state.departments[0]||{}).id,meeting:todayStr()},'data-kind="upload"',false);
  var b=$('#modal button[type=submit]');if(b)b.innerHTML=ic('upload',15)+'Upload';
}
function openRep(id){
  var r=state.reports.find(function(x){return x.id===id});if(!r)return;
  openModal('Edit report details',repFields(false),r,'data-kind="rep" data-id="'+id+'"',true);
}
function openDept(id){
  var d=id?state.departments.find(function(x){return x.id===id}):null;
  openModal(d?'Rename folder':'New folder',[{k:'name',l:'Folder name',req:1,full:1}],d||{},'data-kind="dept" data-id="'+(id||'')+'"',!!d);
}
function svcItems(){var rec=state.services.find(function(s){return s.id===ui.svc});return rec&&rec.items?rec.items.slice():[]}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a;
  if(a==='signout'){signOut();return}
  if(a==='refresh-users'){loadProfiles();return}
  if(a==='auth-mode'){showAuth(el.dataset.v);return}
  if(a==='auth-recheck'){enter();return}
  if(a==='open-rep'){var w=window.open('','_blank');sb.storage.from('reports').createSignedUrl(el.dataset.path,300).then(function(r){if(r.error||!r.data){if(w)w.close();toast('Could not open that file.');return}if(w)w.location=r.data.signedUrl;else location.href=r.data.signedUrl}).catch(function(){if(w)w.close();toast('Could not open that file.')});return}
  if(a==='close'){if(el.classList.contains('scrim')&&e.target!==el)return;closeModal();return}
  if(a==='add'){openForm(el.dataset.col);return}
  if(a==='edit'){openForm(el.dataset.col,el.dataset.id);return}
  if(a==='filter'){ui.f=el.dataset.v;render();return}
  if(a==='plan'){ui.svc=el.dataset.id;location.hash='service';return}
  if(a==='take'){ui.att=el.dataset.id;location.hash='attendance';return}
  if(a==='svc-add'){openSvc();return}
  if(a==='svc-edit'){openSvc(+el.dataset.i);return}
  if(a==='svc-up'||a==='svc-down'){var i=+el.dataset.i,j=a==='svc-up'?i-1:i+1,it=svcItems();if(j<0||j>=it.length)return;var x=it[i];it[i]=it[j];it[j]=x;saveSvc(it);return}
  if(a==='del-ask'){$('#delzone').innerHTML='<div class="confirm">Delete this?<button class="btn danger sm" type="button" data-a="del-do">Yes, delete</button><button class="btn sm" type="button" data-a="del-no">Keep</button></div>';return}
  if(a==='del-no'){$('#delzone').innerHTML='<button class="btn danger sm" type="button" data-a="del-ask">'+ic('trash',15)+'Delete</button>';return}
  if(a==='del-do'){
    var f=$('#modal form');
    if(f.dataset.kind==='rec'){del(f.dataset.col,f.dataset.id)}
    else if(f.dataset.kind==='svc'){var its=svcItems();its.splice(+f.dataset.i,1);saveSvc(its)}
    else if(f.dataset.kind==='rep'){
      var rp=state.reports.find(function(x){return x.id===f.dataset.id});
      del('reports',f.dataset.id);
      if(rp&&rp.assetId&&ASSETS)ASSETS.delete(rp.assetId).catch(function(){});
      toast('Report deleted.');
    }
    else if(f.dataset.kind==='dept'){
      var n=state.reports.filter(function(x){return x.dept===f.dataset.id}).length;
      if(n){toast('This folder still holds '+n+' report'+(n===1?'':'s')+'. Delete or move them first.');return}
      del('departments',f.dataset.id);ui.dept='all';
    }
    closeModal();return;
  }
  if(a==='folder'){ui.dept=el.dataset.id;ui.meet='all';render();return}
  if(a==='meet'){ui.meet=el.dataset.v;render();return}
  if(a==='add-dept'){openDept();return}
  if(a==='edit-dept'){openDept(el.dataset.id);return}
  if(a==='edit-rep'){openRep(el.dataset.id);return}
  if(a==='upload'){openUpload();return}
  if(a==='quick-dept'){
    var nm=el.dataset.v;
    if(!state.departments.some(function(d){return d.name===nm}))put('departments',uid('d'),{name:nm});
    return;
  }
  if(a==='att-all'||a==='att-none'){
    var rec=state.attendance.find(function(r){return r.id===ui.att}),map=Object.assign({},rec&&rec.present?rec.present:{});
    var q=ui.q.toLowerCase();
    state.members.filter(function(m){return m.status!=='Inactive'&&(!q||(m.name||'').toLowerCase().indexOf(q)>=0)}).forEach(function(m){map[m.id]=a==='att-all'});
    attSet(ui.att,map);return;
  }
  if(a==='sample-ask'){ui.sampleAsk=true;render();return}
  if(a==='sample-ask-no'){ui.sampleAsk=false;render();return}
  if(a==='sample-do'){
    ui.sampleAsk=false;
    COLS.forEach(function(c){state[c].filter(function(x){return x.sample}).forEach(function(x){del(c,x.id)})});
    toast('Sample data removed.');render();return;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='previewSel'){ui.preview=el.value;render();return}
  if(el.id==='evsel'){var k=cur();if(k==='service')ui.svc=el.value;else ui.att=el.value;render();return}
  if(el.dataset&&el.dataset.a==='setrole'){setRole(el.dataset.id,el.value);return}
  if(el.dataset&&el.dataset.a==='tick'){var t=state.tasks.find(function(x){return x.id===el.dataset.id});if(t)put('tasks',t.id,Object.assign(strip(t),{status:el.checked?'done':'pending'}));return}
  if(el.dataset&&el.dataset.a==='att'){attMark(ui.att,el.dataset.id,el.checked);return}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){ui.q=e.target.value;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#modal').firstChild)closeModal()});
window.addEventListener('hashchange',function(){ui.q='';ui.f='';ui.sampleAsk=false;render();$('#mainScroll').scrollTop=0;window.scrollTo(0,0)});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,kind=f.dataset.kind,v={};
  if(kind==='auth'){doAuth(f);return}
  Array.prototype.forEach.call(f.elements,function(el){if(el.name)v[el.name]=el.value.trim()});
  if(kind==='church'){put('settings','church',Object.assign({},strip(church()),{name:v.name,branch:v.branch||''}));toast('Details saved.');return}
  if(kind==='rec'){
    var S=SCHEMA[f.dataset.col],id=f.dataset.id,rec=id?state[f.dataset.col].find(function(x){return x.id===id}):null;
    for(var i=0;i<S.fields.length;i++){if(S.fields[i].req&&!v[S.fields[i].k]){toast(S.fields[i].l+' is required.');return}}
    S.fields.forEach(function(fl){if(fl.multi)v[fl.k]=Array.prototype.map.call(f.querySelectorAll('input[name="'+fl.k+'_opt"]:checked'),function(x){return x.value}).join(', ')});
    if(v.bpm!==undefined)v.bpm=v.bpm===''?'':Number(v.bpm);
    var data=Object.assign({},S.def||{},rec?strip(rec):{},v);
    put(f.dataset.col,id||uid(f.dataset.col.charAt(0)),data);closeModal();return;
  }
  if(kind==='dept'){
    if(!v.name){toast('Folder name is required.');return}
    var did=f.dataset.id,dold=did?state.departments.find(function(x){return x.id===did}):null;
    if(state.departments.some(function(d){return d.id!==did&&(d.name||'').toLowerCase()===v.name.toLowerCase()})){toast('A folder with that name already exists.');return}
    put('departments',did||uid('d'),Object.assign({},dold?strip(dold):{},{name:v.name}));closeModal();return;
  }
  if(kind==='rep'){
    if(!v.title||!v.meeting){toast('Title and meeting date are required.');return}
    var rold=state.reports.find(function(x){return x.id===f.dataset.id});
    put('reports',f.dataset.id,Object.assign({},rold?strip(rold):{},{dept:v.dept,meeting:v.meeting,title:v.title,by:v.by,note:v.note}));closeModal();return;
  }
  if(kind==='upload'){
    var file=f.elements.file&&f.elements.file.files[0];
    if(!v.title||!v.meeting){toast('Title and meeting date are required.');return}
    if(!file){toast('Choose a file to upload.');return}
    var ext=(file.name.split('.').pop()||'').toLowerCase(),ct=UPTYPES[ext];
    if(!ct){toast(/^(doc|docx|xls|xlsx|ppt|pptx)$/.test(ext)?'Word, Excel and PowerPoint files cannot be uploaded. Save the file as PDF first.':'That file type cannot be uploaded. Use PDF, image, CSV, text or video.');return}
    if(file.size>20*1024*1024){toast('That file is over 20 MB. Compress it or split it up.');return}
    if(!ASSETS){toast('Uploading is not available for your account in this view.');return}
    var sb=f.querySelector('button[type=submit]');sb.disabled=true;sb.textContent='Uploading…';
    ASSETS.upload(file,{type:ct}).then(function(r){
      return put('reports',uid('r'),{dept:v.dept,meeting:v.meeting,title:v.title,by:v.by,note:v.note,assetId:r.id,fileName:file.name,size:r.sizeBytes,ct:r.contentType,at:new Date().toISOString()});
    }).then(function(){closeModal();ui.dept=v.dept;toast('Report uploaded.');render()}).catch(function(err){
      sb.disabled=false;sb.innerHTML=ic('upload',15)+'Upload';
      var c=err&&err.code;
      toast(c==='too_large'?'That file is too large.':c==='quota_or_state'?'Storage is full. Delete old reports first.':c==='rate_limited'?'Too many uploads. Wait a moment and try again.':c==='unsupported_type'?'That file type cannot be uploaded.':'Upload failed. Check your connection and try again.');
    });
    return;
  }
  if(kind==='svc'){
    var items=svcItems(),idx=f.dataset.i===''?-1:+f.dataset.i,song=state.songs.find(function(s){return s.id===v.song});
    var it={id:(idx>=0&&items[idx]?items[idx].id:uid()),type:v.type,song:v.song||'',label:v.label||(song?song.title:v.type),min:Number(v.min)||0,notes:v.notes||''};
    if(idx>=0)items[idx]=it;else items.push(it);
    saveSvc(items);closeModal();return;
  }
});

/* ---------- auth + boot ---------- */
var STYLE=null;
function showAuth(mode,msg){
  var A=$('#auth');A.hidden=false;mode=mode||'in';var up=mode==='up';
  A.innerHTML='<div class="authcard"><h1>IRM Marsteel Limay, Bataan</h1><p class="sub">'+(up?'Create your account':'Sign in to continue')+'</p>'+
   '<form data-kind="auth" data-mode="'+mode+'" class="fields" style="grid-template-columns:1fr">'+
   (up?'<label class="fld"><span>Full name</span><input name="name" autocomplete="name" required></label>':'')+
   '<label class="fld"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>'+
   '<label class="fld"><span>Password</span><input name="password" type="password" minlength="6" autocomplete="'+(up?'new-password':'current-password')+'" required></label>'+
   (msg?'<div class="note" role="alert">'+esc(msg)+'</div>':'')+
   '<button class="btn primary" type="submit" style="justify-content:center">'+(up?'Create account':'Sign in')+'</button></form>'+
   '<p class="sub" style="margin-top:14px">'+(up?'Already have an account? ':'New here? ')+'<button class="btn sm" data-a="auth-mode" data-v="'+(up?'in':'up')+'">'+(up?'Sign in':'Create account')+'</button></p></div>';
}
function showPending(msg){
  var A=$('#auth');A.hidden=false;
  A.innerHTML='<div class="authcard"><h1>'+(msg?'Something went wrong':'Waiting for approval')+'</h1><p class="sub">'+esc(msg||'Your account is created, but a church admin still needs to approve it. Ask them to set your role, then check again.')+'</p><div class="acts" style="margin-top:14px"><button class="btn primary" data-a="auth-recheck">Check again</button><button class="btn" data-a="signout">Sign out</button></div></div>';
}
function doAuth(f){
  var up=f.dataset.mode==='up',em=f.elements.email.value.trim(),pw=f.elements.password.value,b=f.querySelector('button[type=submit]');
  b.disabled=true;
  var p=up?sb.auth.signUp({email:em,password:pw,options:{data:{full_name:f.elements.name.value.trim()}}}):sb.auth.signInWithPassword({email:em,password:pw});
  p.then(function(r){
    if(r.error){showAuth(f.dataset.mode,r.error.message);return}
    if(r.data&&r.data.session){session=r.data.session;enter()}
    else showAuth('in','Account created. Check your email to confirm it, then sign in.');
  }).catch(function(){showAuth(f.dataset.mode,'Could not reach the server. Check your connection.')});
}
function signOut(){
  if(chan){sb.removeChannel(chan);chan=null}
  return sb.auth.signOut().then(function(){session=null;db=null;ACCESS={role:'Viewer',adm:false,ro:false,known:false};COLS.forEach(function(c){state[c]=[]});PROF=[];ui.profLoaded=false;ui.ready=false;render();showAuth('in')});
}
function enter(){
  if(!session){showAuth('in');return}
  sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle().then(function(r){
    chk(r);var role=r.data&&r.data.role;
    if(!role||role==='pending'){showPending();return}
    ACCESS={role:{owner:'Owner',editor:'Editor',contributor:'Contributor',viewer:'Viewer'}[role],adm:role==='owner'||role==='editor',ro:role==='viewer',known:true};
    db=true;ui.ready=false;ui.preview='real';$('#auth').hidden=true;render();
    return Promise.all(COLS.map(function(c){return load(c)})).then(function(){ui.ready=true;render();subscribe()});
  }).catch(function(e){showPending((e&&e.message)||'Could not load your profile.')});
}
function subscribe(){
  if(chan)sb.removeChannel(chan);
  var t={};chan=sb.channel('hub');
  COLS.forEach(function(c){chan.on('postgres_changes',{event:'*',schema:'public',table:TAB[c]},function(){clearTimeout(t[c]);t[c]=setTimeout(function(){reload(c)},250)})});
  chan.subscribe();
}
render();
(function boot(){
  if(!window.supabase||!window.supabase.createClient){showPending('The Supabase library could not load. Check your internet connection and reload.');return}
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.getSession().then(function(r){session=r.data.session;if(session)enter();else showAuth('in')});
  sb.auth.onAuthStateChange(function(ev,s){if(ev==='TOKEN_REFRESHED'&&s)session=s});
})();
})();
</script>
